<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>BaDC人格与决策倾向测试 - 2026测试系统</title>
  <meta name="description" content="基于情境化抉择偏好，量化测定您的底层人格类型（A者/B者/C者/D者）。采用自适应响应式设计。">
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <!-- Shared Stylesheet -->
  <link rel="stylesheet" href="../index.css">
  
  <!-- Module Specific Styles -->
  <style>
    .module-wrapper {
      max-width: 800px;
      margin: 4rem auto;
      padding: 0 1.5rem;
    }
    
    .panel {
      background-color: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 3rem 2.5rem;
      box-shadow: var(--shadow);
      transition: var(--transition-smooth);
    }
    
    /* Step 1: Welcome */
    .intro-header {
      text-align: center;
      margin-bottom: 2.5rem;
    }
    .intro-header h1 {
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.75rem;
    }
    .intro-header p {
      color: var(--text-secondary);
      font-size: 1.05rem;
      line-height: 1.6;
      max-width: 600px;
      margin: 0 auto;
    }
    .intro-features {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
      margin-bottom: 3rem;
    }
    .feature-card {
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1.5rem;
      background-color: var(--bg-primary);
    }
    .feature-card h3 {
      font-family: var(--font-mono);
      font-size: 0.9rem;
      margin-bottom: 0.5rem;
      color: var(--text-primary);
    }
    .feature-card p {
      font-size: 0.85rem;
      color: var(--text-secondary);
      line-height: 1.5;
    }
    
    /* Step 2: Testing Interface */
    .test-progress-bar {
      width: 100%;
      height: 4px;
      background-color: var(--bg-tertiary);
      border-radius: 2px;
      margin-bottom: 2.5rem;
      overflow: hidden;
      position: relative;
    }
    .progress-fill {
      height: 100%;
      background-color: var(--text-primary);
      width: 0%;
      transition: width 0.4s ease;
    }
    .test-stats-row {
      display: flex;
      justify-content: space-between;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--text-secondary);
      margin-bottom: 1.5rem;
    }
    .question-box {
      margin-bottom: 2.5rem;
    }
    .question-label {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      letter-spacing: 0.15em;
      color: var(--text-secondary);
      text-transform: uppercase;
      margin-bottom: 1rem;
    }
    .question-text {
      font-size: 1.6rem;
      font-weight: 600;
      line-height: 1.4;
      color: var(--text-primary);
    }
    
    /* Options stack */
    .options-stack {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-bottom: 1rem;
    }
    .option-card {
      border: 1px solid var(--border);
      background-color: var(--bg-primary);
      border-radius: 6px;
      padding: 1.25rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 1.25rem;
      cursor: pointer;
      text-align: left;
      transition: var(--transition-fast);
      user-select: none;
    }
    .option-card:hover {
      border-color: var(--border-hover);
      transform: translateX(4px);
    }
    .option-badge {
      width: 28px;
      height: 28px;
      border: 1px solid var(--border);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-secondary);
      background-color: var(--bg-secondary);
      transition: var(--transition-fast);
    }
    .option-card:hover .option-badge {
      border-color: var(--text-primary);
      background-color: var(--text-primary);
      color: var(--accent-inverse);
    }
    .option-text {
      font-size: 0.95rem;
      line-height: 1.5;
      color: var(--text-primary);
    }
    
    /* Step 3: Result dashboard */
    .result-score-container {
      text-align: center;
      margin-bottom: 3rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 2.5rem;
    }
    .result-score-label {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      letter-spacing: 0.1em;
      color: var(--text-secondary);
      margin-bottom: 0.5rem;
    }
    .result-score-val {
      font-size: 5rem;
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.02em;
      margin-bottom: 1.25rem;
      color: var(--text-primary);
      text-shadow: var(--glow);
    }
    .result-class-badge {
      display: inline-block;
      border: 1px solid var(--text-primary);
      padding: 0.35rem 1rem;
      border-radius: 100px;
      font-size: 0.9rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
    }
    .result-class-desc {
      color: var(--text-secondary);
      font-size: 1.05rem;
      line-height: 1.6;
      max-width: 550px;
      margin: 0 auto;
    }
    
    /* Profile Breakdown Bar list */
    .breakdown-section {
      margin: 3rem 0;
      border-top: 1px dashed var(--border);
      padding-top: 2.5rem;
    }
    .breakdown-title {
      font-family: var(--font-mono);
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
      color: var(--text-primary);
      text-align: center;
    }
    .breakdown-list {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }
    .breakdown-item {
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }
    .breakdown-label {
      width: 140px;
      font-weight: 500;
      font-size: 0.9rem;
      color: var(--text-secondary);
      display: flex;
      justify-content: space-between;
    }
    .breakdown-label.active {
      color: var(--text-primary);
      font-weight: 600;
    }
    .breakdown-track {
      flex: 1;
      height: 12px;
      background-color: var(--bg-primary);
      border: 1px solid var(--border);
      border-radius: 3px;
      overflow: hidden;
      position: relative;
    }
    .breakdown-fill {
      height: 100%;
      background-color: var(--text-tertiary);
      width: 0%;
      transition: width 1s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .breakdown-item.active .breakdown-fill {
      background-color: var(--text-primary);
    }
    .breakdown-val {
      width: 45px;
      text-align: right;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      color: var(--text-secondary);
    }
    .breakdown-item.active .breakdown-val {
      color: var(--text-primary);
      font-weight: 600;
    }
    
    /* Views State Management */
    .view-step {
      display: none;
    }
    .view-step.active {
      display: block;
    }
    
    /* Responsive styling */
    @media (max-width: 600px) {
      .module-wrapper {
        margin: 2rem auto;
      }
      .panel {
        padding: 2rem 1.5rem;
      }
      .intro-features {
        grid-template-columns: 1fr;
        gap: 1rem;
      }
      .question-text {
        font-size: 1.4rem;
      }
      .option-card {
        padding: 1rem;
        gap: 1rem;
      }
      .breakdown-item {
        gap: 0.75rem;
      }
      .breakdown-label {
        width: 110px;
        font-size: 0.85rem;
      }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <div class="container header-inner">
      <a href="../index.html" class="logo">
        <span class="status-dot"></span>
        <span>2026测试系统</span>
      </a>
      <div class="header-controls">
        <span class="system-status">模块：BaDC人格测试</span>
        <button class="theme-toggle" id="themeToggleBtn" aria-label="切换主题" title="切换黑白主题">
          <svg id="themeIcon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
            <path d="M12 3c.132 0 .263 0 .393.007a7.5 7.5 0 0 0 7.92 12.446A9 9 0 1 1 12 2.992z"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="module-wrapper">
    <div class="panel">
      
      <!-- STEP 1: WELCOME SCREEN -->
      <div id="viewWelcome" class="view-step active">
        <div class="intro-header" style="margin-bottom: 3.5rem;">
          <h1>BaDC 人格与决策倾向测试</h1>
          <p>基于情境化决策偏好评估，测定您的底层行为倾向与人格维度（A者/B者/C者/D者）。</p>
        </div>
        
        <button class="btn btn-primary" style="width: 100%;" onclick="startTest()">立即开始测试</button>
      </div>

      <!-- STEP 2: ACTIVE TESTING SCREEN -->
      <div id="viewTesting" class="view-step">
        <div class="test-progress-bar">
          <div id="progressFill" class="progress-fill"></div>
        </div>
        
        <div class="test-stats-row">
          <div>当前进度: <span id="lblQuestionIndex" class="history-val-highlight">0 / 0</span></div>
          <div id="lblProgressPercent">0%</div>
        </div>
        
        <div class="question-box">
          <div class="question-label" id="lblQuestionCode">NODE: BADC_Q_01</div>
          <div class="question-text" id="lblQuestionText">正在加载题目内容...</div>
        </div>
        
        <div class="options-stack" id="optionsStack">
          <!-- Options will be populated dynamically -->
        </div>
      </div>

      <!-- STEP 3: RESULTS SCREEN -->
      <div id="viewResults" class="view-step">
        <div class="result-score-container">
          <div class="result-score-label">您的人格维度判定结果</div>
          <div class="result-score-val" id="resType">A者</div>
          <div class="result-class-badge" id="resTitleBadge">冒险探求者</div>
          <div class="result-class-desc" id="resDesc">
            您拥有极高的风险耐受度与探索欲。
          </div>
        </div>

        <!-- Progress Bars Breakdown -->
        <div class="breakdown-section">
          <h3 class="breakdown-title">您的认知倾向维度分布 (Tendency Profile)</h3>
          <div class="breakdown-list">
            
            <div class="breakdown-item" id="breakdownA">
              <span class="breakdown-label">A者 </span>
              <div class="breakdown-track"><div class="breakdown-fill"></div></div>
              <span class="breakdown-val">0%</span>
            </div>
            
            <div class="breakdown-item" id="breakdownB">
              <span class="breakdown-label">B者 </span>
              <div class="breakdown-track"><div class="breakdown-fill"></div></div>
              <span class="breakdown-val">0%</span>
            </div>
            
            <div class="breakdown-item" id="breakdownC">
              <span class="breakdown-label">C者 </span>
              <div class="breakdown-track"><div class="breakdown-fill"></div></div>
              <span class="breakdown-val">0%</span>
            </div>
            
            <div class="breakdown-item" id="breakdownD">
              <span class="breakdown-label">D者 </span>
              <div class="breakdown-track"><div class="breakdown-fill"></div></div>
              <span class="breakdown-val">0%</span>
            </div>

          </div>
        </div>
        
        <div style="margin-top: 3rem; display: flex; gap: 1rem;">
          <button class="btn btn-primary" style="flex: 1;" onclick="restartTest()">重新测试</button>
          <a href="../index.html" class="btn" style="flex: 1; text-decoration: none;">返回主页面</a>
        </div>
      </div>

    </div>
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="container footer-inner">
      <div class="footer-left">
        <div>&copy; 2026 NEO-TEST CORE. ALL RIGHTS RESERVED.</div>
      </div>
      <div class="footer-right">
        <a href="../index.html" class="footer-link">主控台</a>
      </div>
    </div>
  </footer>

  <!-- Load Engine and Local Script -->
  <script src="engine.js"></script>
  <script>
    // Instantiate test engine
    const engine = new BaDCEngine();

    // Theme Toggle Handler
    const htmlEl = document.documentElement;
    const themeBtn = document.getElementById('themeToggleBtn');
    const themeIcon = document.getElementById('themeIcon');
    
    const darkIconPath = "M12 3c.132 0 .263 0 .393.007a7.5 7.5 0 0 0 7.92 12.446A9 9 0 1 1 12 2.992z";
    const lightIconPath = "M12 18a6 6 0 1 1 0-12 6 6 0 0 1 0 12zm0-2a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM11 1h2v3h-2V1zm0 19h2v3h-2v-3zM3.515 4.929l1.414-1.414 2.122 2.122-1.414 1.414-2.122-2.122zm14.142 14.142l1.414-1.414 2.122 2.122-1.414 1.414-2.122-2.122zM1 11h3v2H1v-2zm19 0h3v2h-3v-2zM3.515 19.071l2.122-2.122 1.414 1.414-2.122 2.122-1.414-1.414zm14.142-14.142l2.122-2.122 1.414 1.414-2.122 2.122-1.414-1.414z";

    const savedTheme = localStorage.getItem('theme') || 'dark';
    htmlEl.setAttribute('data-theme', savedTheme);
    updateThemeIcon(savedTheme);

    themeBtn.addEventListener('click', () => {
      const currentTheme = htmlEl.getAttribute('data-theme');
      const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
      
      htmlEl.setAttribute('data-theme', newTheme);
      localStorage.setItem('theme', newTheme);
      updateThemeIcon(newTheme);
    });

    function updateThemeIcon(theme) {
      if (theme === 'dark') {
        themeIcon.setAttribute('viewBox', '0 0 24 24');
        themeIcon.innerHTML = `<path d="${darkIconPath}"/>`;
      } else {
        themeIcon.setAttribute('viewBox', '0 0 24 24');
        themeIcon.innerHTML = `<path d="${lightIconPath}"/>`;
      }
    }

    // Step View Transition Manager
    function showView(viewId) {
      document.querySelectorAll('.view-step').forEach(v => v.classList.remove('active'));
      document.getElementById(viewId).classList.add('active');
    }

    // Start Test
    async function startTest() {
      // Initialize questions async (fetch or fallback)
      await engine.initialize();
      showView('viewTesting');
      updateTestingView();
    }

    // Option selection
    function selectOption(optionType) {
      engine.submitAnswer(optionType);
      
      setTimeout(() => {
        if (engine.isFinished) {
          showResults();
        } else {
          updateTestingView();
        }
      }, 250);
    }

    // Update Question Card UI
    function updateTestingView() {
      const q = engine.getCurrentQuestion();
      if (!q) return;

      const total = engine.questions.length;
      const currentNum = engine.currentIndex + 1;
      
      // Progress numbers
      document.getElementById('lblQuestionIndex').textContent = `${currentNum} / ${total}`;
      
      const percent = Math.round(((currentNum - 1) / total) * 100);
      document.getElementById('lblProgressPercent').textContent = `${percent}%`;
      document.getElementById('progressFill').style.width = `${percent}%`;

      // Question metadata
      document.getElementById('lblQuestionCode').textContent = `NODE: BADC_Q_${currentNum.toString().padStart(2, '0')}`;
      document.getElementById('lblQuestionText').textContent = q.question;

      // Populate options stack
      const stack = document.getElementById('optionsStack');
      stack.innerHTML = '';

      q.options.forEach(opt => {
        const card = document.createElement('div');
        card.className = 'option-card';
        card.onclick = () => selectOption(opt.type);

        const badge = document.createElement('div');
        badge.className = 'option-badge';
        badge.textContent = opt.type;

        const text = document.createElement('div');
        text.className = 'option-text';
        text.textContent = opt.text;

        card.appendChild(badge);
        card.appendChild(text);
        stack.appendChild(card);
      });
    }

    // Show results
    function showResults() {
      showView('viewResults');
      
      const report = engine.getPersonalityProfile();
      if (!report) return;

      document.getElementById('resType').textContent = report.type + '者';
      document.getElementById('resTitleBadge').textContent = report.profile.title.split(' (')[0];
      document.getElementById('resDesc').textContent = report.profile.desc;

      // Populate progress bars
      const types = ['A', 'B', 'C', 'D'];
      types.forEach(t => {
        const row = document.getElementById(`breakdown${t}`);
        const fill = row.querySelector('.breakdown-fill');
        const valText = row.querySelector('.breakdown-val');
        const label = row.querySelector('.breakdown-label');
        
        const percent = report.percentages[t];
        valText.textContent = `${percent}%`;
        fill.style.width = `${percent}%`;
        
        // Highlight the dominant profile row
        if (t === report.type) {
          row.classList.add('active');
        } else {
          row.classList.remove('active');
        }
      });
    }

    // Restart Test
    function restartTest() {
      engine.reset();
      showView('viewWelcome');
    }

  </script>
</body>
</html>
